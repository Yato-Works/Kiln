[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln"
version = "0.1.0"
description = "Kiln: Embedded Deep Learning Compiler (Zero-malloc, bit-exact C99 generator)"
authors = [
    { name = "Kiln Team" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
frontend = [
    "torch>=2.0.0",
]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "torch>=2.0.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
kiln = "kiln.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kiln*"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["examples/kws/*.pt", "speech_commands_test_set_v0.02.tar.gz"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
files = ["kiln"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"
ignore_missing_imports = true
