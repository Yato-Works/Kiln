name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The interesting tests compile the emitted C with gcc and compare it against
    # an independent Python reference, so a C99 toolchain is required (the
    # ubuntu runner image ships one).  Windows/macOS runners would mostly skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Kiln
        run: python -m pip install -e ".[test,dev]"

      - name: Format and lint
        run: |
          python -m ruff format --check kiln tests scripts/capture_serial.py
          python -m ruff check kiln tests scripts/capture_serial.py

      - name: Type check
        run: python -m mypy kiln

      - name: CLI smoke test
        run: |
          python -m kiln ops
          python -m kiln --help
          python -m kiln selftest --json
          python -m kiln doctor --json

      - name: Phase 1 certificate (emits C, builds it with gcc, scores it)
        run: python -m examples.kws.evaluate

      - name: Phase 4 link smoke test (strict compile + link + image measurement + replay)
        # Evidence that the emitted C still compiles as a program, that the model
        # object references no allocator and that the linked binary's labels match
        # the reference; the suite below repeats this for both reference specs.
        run: python -m kiln link examples/hazard/kiln.yaml --run

      - name: Install ARM Embedded Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Phase 4 Cortex-M cross-compile & image inspection
        # Bare-metal target profiles are compile/image-inspection only until a
        # truthful system-emulator or hardware runner is configured.
        run: python -m kiln link examples/hazard/kiln.yaml --target cortex-m0plus

      - name: Phase 4 Cortex-M system-emulator replay
        # This boots a freestanding Cortex-M3 image in QEMU system emulation;
        # qemu-user is intentionally not used for a bare-metal artifact.
        run: |
          python -m kiln link examples/hazard/kiln.yaml \
            --target cortex-m3-qemu --run --output "$RUNNER_TEMP/kiln-qemu-link"
          grep -F "Evidence              : qemu-system-arm" \
            "$RUNNER_TEMP/kiln-qemu-link/execution_certificate.txt"

      - name: Test suite
        # The 107 MB Speech Commands archive is not vendored, so the tests that
        # need raw WAVs report as skipped; everything else (including the KWS
        # accuracy/budget cheque, which only needs the tracked precomputed
        # corpus and checkpoint) must pass.
        run: python -m pytest tests/ -q -rs
