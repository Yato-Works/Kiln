name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The interesting tests compile the emitted C with gcc and compare it against
    # an independent Python reference, so a C99 toolchain is required (the
    # ubuntu runner image ships one).  Windows/macOS runners would mostly skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Kiln
        run: python -m pip install -e ".[test,dev]"

      - name: Format and lint
        run: |
          python -m ruff format --check kiln tests scripts/capture_serial.py
          python -m ruff check kiln tests scripts/capture_serial.py

      - name: Type check
        run: python -m mypy kiln

      - name: CLI smoke test
        run: |
          python -m kiln ops
          python -m kiln --help
          python -m kiln selftest --json
          python -m kiln doctor --json
          python -m kiln validate examples/vm/hello.kir.json
          python -m kiln vm examples/vm/hello.kir.json --input examples/vm/input.json --json
          python -m kiln compile-kir examples/vm/hello.kir.json \
            -o "$RUNNER_TEMP/kiln-tutorial.c" --runtime-header None
          python -m kiln link examples/vm/hello.kir.json --run \
            --output "$RUNNER_TEMP/kiln-tutorial-link"
          python -m kiln validate examples/hazard/hazard.kir.json
          python -m kiln vm examples/hazard/hazard.kir.json \
            --input examples/hazard/data/example_tokens.json --json
          python -m kiln link examples/hazard/hazard.kir.json --run \
            --output "$RUNNER_TEMP/kiln-hazard-bundle-link"
          python -m examples.hazard.predict \
            --text "print(eval(user_input))" --json
          python -m kiln validate examples/kws/kws.kir.json
          python -m examples.kws.predict \
            --input examples/kws/example_input.json --json
          python -m kiln link examples/kws/kws.kir.json --run \
            --output "$RUNNER_TEMP/kiln-kws-bundle-link"

      - name: Phase 1 certificate (emits C, builds it with gcc, scores it)
        run: python -m examples.kws.evaluate

      - name: Phase 4 link smoke test (strict compile + link + image measurement + replay)
        # Evidence that the emitted C still compiles as a program, that the model
        # object references no allocator and that the linked binary's labels match
        # the reference; the suite below repeats this for both reference specs.
        run: python -m kiln link examples/hazard/kiln.yaml --run

      - name: Install ARM Embedded Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Phase 4 Cortex-M cross-compile & image inspection
        # Bare-metal target profiles are compile/image-inspection only until a
        # truthful system-emulator or hardware runner is configured.
        run: python -m kiln link examples/hazard/kiln.yaml --target cortex-m0plus

      - name: Phase 4 Cortex-M system-emulator replay
        # This boots a freestanding Cortex-M3 image in QEMU system emulation;
        # qemu-user is intentionally not used for a bare-metal artifact.
        run: |
          python -m kiln link examples/hazard/kiln.yaml \
            --target cortex-m3-qemu --run --output "$RUNNER_TEMP/kiln-qemu-link"
          grep -F "Evidence              : qemu-system-arm" \
            "$RUNNER_TEMP/kiln-qemu-link/execution_certificate.txt"

      - name: Generate repository certificate fixtures
        # The RP2040 adapter test consumes this intentionally generated local
        # certificate; the build directory itself remains ignored.
        run: python -m kiln build examples/hazard/kiln.yaml

      - name: Test suite
        # The 107 MB Speech Commands archive is not vendored, so the tests that
        # need raw WAVs report as skipped; everything else (including the KWS
        # accuracy/budget cheque, which only needs the tracked precomputed
        # corpus and checkpoint) must pass.
        run: python -m pytest tests/ -q -rs

  package:
    # Keep packaging failures separate from the source-tree test environment.
    # This verifies that the published wheel contains everything the CLI needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/kiln-wheel-env"
          "$RUNNER_TEMP/kiln-wheel-env/bin/python" -m pip install dist/kiln-*.whl
          "$RUNNER_TEMP/kiln-wheel-env/bin/python" -m kiln selftest --json
          "$RUNNER_TEMP/kiln-wheel-env/bin/python" -m kiln ops
          "$RUNNER_TEMP/kiln-wheel-env/bin/python" -c \
            "import importlib.metadata as metadata; import kiln; assert metadata.version('kiln') == kiln.__version__"
