name: Bug report
description: Report a reproducible problem in Kiln
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please include the smallest reproducible case and avoid secrets or private model data.
  - type: input
    id: version
    attributes:
      label: Kiln version or commit
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands, input bundle/spec, and complete error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, compiler/target, and optional dependencies.
    validations:
      required: true
